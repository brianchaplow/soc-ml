# Maximum Noise Campaign — Phases 3-9 (Continuation)
# Skips phases 1-2 (recon_maximum, web_assault) which completed in CAMP-20260207-145311
#
# Original campaign: maximum_noise_48h.yaml
# Bug fixed: sqlmap timeout (30m), per-attack timeout (45m) in runner.sh
#
# Duration: ~34 hours (original phases 3-9 mapped to hours 0-34)
# Start: Phase 3 (brute_force_barrage) through Phase 9 (final_barrage)

campaign:
  name: "maximum_noise_phases3-9"
  description: "Continuation of 48h noise campaign — phases 3-9 (brute force through final barrage)"
  duration_hours: 34

intensity:
  schedule:
    # Constant high intensity with burst windows
    - { hour: 0,  level: high }
    - { hour: 3,  level: burst }
    - { hour: 4,  level: high }
    - { hour: 6,  level: burst }
    - { hour: 7,  level: high }
    - { hour: 10, level: burst }
    - { hour: 11, level: high }
    - { hour: 14, level: burst }
    - { hour: 15, level: high }
    - { hour: 18, level: burst }
    - { hour: 19, level: high }
    - { hour: 22, level: burst }
    - { hour: 23, level: high }
    - { hour: 26, level: burst }
    - { hour: 27, level: high }
    - { hour: 30, level: burst }
    - { hour: 31, level: high }
    - { hour: 33, level: burst }

phases:
  # ==========================================================================
  # PHASE 3: BRUTE FORCE BARRAGE (Hours 0-6)
  # Maximum threads, large wordlists, no delays
  # ==========================================================================
  - name: brute_force_barrage
    start_hour: 0
    end_hour: 6
    note: "Maximum volume brute force - 64 threads, no delays"
    attacks:
      # SSH brute force
      - brute_ssh
      - noise_hydra_ssh_max
      # FTP brute force
      - brute_ftp
      - noise_hydra_ftp_max
      # Telnet brute force
      - brute_telnet
      - noise_hydra_telnet_max
      # Database brute force
      - brute_mysql
      - brute_postgres
      - noise_hydra_mysql_max
      - noise_medusa_parallel
      # SMB brute force
      - smb_brute
      - noise_cme_brute
      # RDP brute force
      - win_rdp_brute
      - noise_hydra_rdp_max
      # Web login brute
      - cred_login
      - cred_stuffing
      - noise_patator_http
    targets:
      - 10.10.40.10
      - 10.10.40.20
      - 10.10.40.21

  # ==========================================================================
  # PHASE 4: EXPLOITATION FRENZY (Hours 6-14)
  # Metasploit modules, reverse shells, meterpreter
  # ==========================================================================
  - name: exploit_frenzy
    start_hour: 6
    end_hour: 14
    note: "Maximum exploitation - Metasploit with payloads, reverse shells"
    attacks:
      # Metasploit Linux exploits
      - msf_vsftpd
      - msf_distcc
      - msf_postgres
      - msf_mysql
      - msf_java_rmi
      - msf_tomcat
      - msf_telnet
      # Metasploit Windows exploits
      - msf_glassfish_traversal
      - msf_struts_rce
      - msf_jenkins_script
      - msf_elasticsearch_rce
      - msf_manageengine
      - msf_ms17_010
      - msf_iis_webdav
      # Windows expanded
      - win_glassfish
      - win_struts
      - win_jenkins
      - win_wamp
      - win_elasticsearch
      - win_manageengine
      # Metasploit with reverse shells
      - noise_msf_shells
      - noise_msf_meterpreter
    targets:
      - 10.10.40.20
      - 10.10.40.21

  # ==========================================================================
  # PHASE 5: C2 AND EXFILTRATION (Hours 14-20)
  # Sliver C2, DNS tunneling, ICMP tunneling, HTTP beacons
  # ==========================================================================
  - name: c2_exfil_maximum
    start_hour: 14
    end_hour: 20
    note: "C2 beacon flood and exfiltration simulation"
    attacks:
      # HTTP C2
      - c2_beacon_http
      - c2_exfil_http
      - noise_sliver_http
      - noise_beacon_rapid
      # DNS C2
      - c2_beacon_dns
      - exfil_dns
      - noise_dnscat2
      - noise_iodine
      # ICMP tunneling
      - exfil_icmp
      - noise_ptunnel
      # Large data exfil
      - noise_exfil_large_http
      - noise_exfil_large_dns
      - noise_exfil_encoded
    targets:
      - 10.10.40.0/24

  # ==========================================================================
  # PHASE 6: SMB/NETWORK ATTACKS (Hours 20-24)
  # Responder, relay, pass-the-hash, Impacket suite
  # ==========================================================================
  - name: network_assault
    start_hour: 20
    end_hour: 24
    note: "SMB relay, LLMNR poisoning, protocol abuse"
    attacks:
      # SMB enumeration and attacks
      - smb_enum
      - smb_brute
      - smb_relay
      - noise_impacket_psexec
      - noise_impacket_wmiexec
      - noise_impacket_smbexec
      - noise_impacket_atexec
      # LLMNR/NBT-NS (VLAN 40 only)
      - noise_responder_analyze
      # SNMP
      - snmp_enum
      - snmp_full
      - noise_snmp_walk_full
      # DNS attacks
      - dns_zone_transfer
      - dns_enum
      - noise_dns_axfr_all
    targets:
      - 10.10.40.20
      - 10.10.40.21
      - 10.10.40.43

  # ==========================================================================
  # PHASE 7: ACTIVE DIRECTORY ASSAULT (Hours 24-30)
  # BloodHound, Kerberoast, AS-REP roast, DCSync, pass-the-hash
  # ==========================================================================
  - name: ad_assault
    start_hour: 24
    end_hour: 30
    note: "Full AD attack chain - loud Kerberos/LDAP/SMB traffic"
    attacks:
      # Enumeration
      - ad_ldap_enum
      - ad_kerb_enum
      - noise_kerbrute_users
      - noise_kerbrute_passwords
      # BloodHound
      - ad_bloodhound
      - noise_bloodhound_all
      # Kerberos attacks
      - ad_kerberoast
      - ad_asrep_roast
      - noise_rubeus_kerberoast
      - noise_rubeus_asrep
      # Password attacks
      - ad_password_spray
      - noise_cme_spray
      # Lateral movement
      - ad_lateral_pth
      - noise_impacket_pth
      - noise_cme_pth
      # DCSync
      - ad_dcsync
      - noise_secretsdump
      # Zerologon check
      - ad_zerologon
      # AD CS attacks (Certipy)
      - noise_certipy_find
      - noise_certipy_esc1
      - noise_certipy_shadow
      # Authentication coercion
      - noise_coercer_scan
      - noise_coercer_coerce
      # LDAP enumeration
      - noise_ldapdomaindump
    targets:
      - 10.10.30.40
      - 10.10.30.41

  # ==========================================================================
  # PHASE 8: GAP ATTACKS - Underrepresented Patterns (Hours 30-33)
  # C2 simulation, encrypted channels, cryptomining, anomalies
  # ==========================================================================
  - name: gap_attacks
    start_hour: 30
    end_hour: 33
    note: "Gap-filling attacks - C2, mining, anomalous patterns"
    attacks:
      # C2 Framework Simulation
      - gap_cobalt_beacon
      - gap_cobalt_stager
      - gap_meterpreter_https
      - gap_meterpreter_tcp
      - gap_empire_stager
      - gap_mythic_c2
      - gap_havoc_demon
      # Encrypted Channel Abuse
      - gap_tls_nonstandard
      - gap_tls_anomalies
      - gap_tls_jitter
      # Protocol Abuse
      - gap_http2_flood
      - gap_websocket_abuse
      # Cryptomining Simulation
      - gap_stratum_mining
      - gap_xmrig_pattern
      - gap_coinhive_pattern
      # Advanced Beaconing
      - gap_beacon_base64
      - gap_beacon_dns_txt
      - gap_beacon_icmp
      - gap_beacon_headers
      # Anomalous Traffic
      - gap_large_posts
      - gap_high_frequency
      - gap_ua_anomalies
      - gap_exe_downloads
      - gap_staged_download
    targets:
      - 10.10.40.0/24

  # ==========================================================================
  # PHASE 9: FINAL BARRAGE (Hours 33-34)
  # Everything at once - maximum concurrent attacks
  # ==========================================================================
  - name: final_barrage
    start_hour: 33
    end_hour: 34
    note: "Final barrage - all attack types simultaneously"
    attacks:
      # Recon
      - recon_aggressive
      - noise_masscan
      # Web
      - noise_sqlmap_max
      - noise_nuclei_full
      - web_xss
      - web_cmdi
      # Brute force
      - noise_hydra_ssh_max
      - noise_hydra_ftp_max
      - noise_cme_brute
      # Exploit
      - msf_vsftpd
      - msf_struts_rce
      - noise_msf_shells
      # C2
      - noise_sliver_http
      - noise_beacon_rapid
      - noise_dnscat2
      # Network
      - noise_impacket_psexec
      - smb_enum
      # API
      - api_bola
      - api_jwt
      - api_full
      # WAF bypass (still loud)
      - waf_sqli_bypass
      - waf_rate_flood
      # New tools final burst
      - noise_ffuf_dirs
      - noise_feroxbuster
      - noise_dalfox_scan
      - noise_commix_scan
      - noise_certipy_find
      - noise_coercer_coerce
      - noise_httpx_targets
      # Gap attacks in final barrage
      - gap_cobalt_beacon
      - gap_meterpreter_https
      - gap_stratum_mining
      - gap_beacon_dns_txt
      - gap_ua_anomalies
    targets:
      - 10.10.40.0/24

# Timing - MINIMAL DELAYS for maximum noise
timing:
  min_delay_seconds: 5
  max_delay_seconds: 60
  cooldown_after_burst_seconds: 30
  jitter_percent: 10
  ad_phase_min_delay_seconds: 10
  ad_phase_max_delay_seconds: 60

# All targets
targets:
  dvwa: { ip: "10.10.40.10", ports: [80] }
  juice_shop: { ip: "10.10.40.10", ports: [3000] }
  metasploitable: { ip: "10.10.40.20", ports: [21, 22, 23, 80, 445, 3306, 5432, 8180] }
  windows: { ip: "10.10.40.21", ports: [21, 22, 80, 445, 3000, 3306, 3389, 4848, 5985, 8020, 8080, 8282, 8484, 8585, 9200] }
  wordpress: { ip: "10.10.40.30", ports: [80, 443] }
  crapi: { ip: "10.10.40.31", ports: [80, 443] }
  vsftpd: { ip: "10.10.40.32", ports: [21] }
  smtp: { ip: "10.10.40.42", ports: [25] }
  snmpd: { ip: "10.10.40.43", ports: [161] }
  honeypot: { ip: "10.10.40.33", ports: [8080] }
  ad_dc: { ip: "10.10.30.40", ports: [53, 88, 135, 389, 445, 636, 5985] }
  ad_ws: { ip: "10.10.30.41", ports: [445, 3389, 5985] }

# Attack definitions inherited from maximum_noise_48h.yaml
# All noise_* and gap_* functions defined in noise_attacks.sh and gap_attacks.sh
